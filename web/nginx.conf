server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Cabeçalhos de segurança do aplicativo.
  # ATENÇÃO: no Nginx, um add_header dentro de um location ANULA todos estes
  # (eles só são herdados quando o location não tem nenhum add_header). Por
  # isso os locations abaixo usam "expires" para o cache, e não add_header.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Só scripts do próprio site. O PrimeReact usa estilos inline, por isso 'unsafe-inline' em style-src.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # API de autenticação: o navegador chama /api/auth/*, o Nginx repassa para /auth/*
  location /api/auth/ {
    proxy_pass http://autenticacao:3001/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Arquivos do build com hash no nome podem ficar em cache por muito tempo
  location /assets/ {
    expires 1y;   # Cache-Control: max-age=31536000
  }

  # Rotas do React Router (ex.: /login) caem no index.html
  location / {
    try_files $uri /index.html;
    expires -1;   # Cache-Control: no-cache
  }
}
