server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 6m;

  # Cabeçalhos de segurança do aplicativo.
  # ATENÇÃO: no Nginx, um add_header dentro de um location ANULA todos estes
  # (eles só são herdados quando o location não tem nenhum add_header). Por
  # isso os locations abaixo usam "expires" para o cache, e não add_header.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Só scripts do próprio site. O PrimeReact usa estilos inline, por isso 'unsafe-inline' em style-src.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # API de autenticação: o navegador chama /api/auth/*, o Nginx repassa para /auth/*
  location /api/auth/ {
    proxy_pass http://autenticacao:3001/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # REST de Publicações. O aplicativo usa a mesma origem e envia o JWT
  # no cabeçalho Authorization; o serviço valida o token por gRPC.
  location = /api/publicacoes {
    proxy_pass http://publicacoes:3002/publicacoes;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/publicacoes/ {
    proxy_pass http://publicacoes:3002/publicacoes/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # REST de Buscas. O serviço tem banco próprio e valida o JWT por gRPC.
  location = /api/buscas {
    proxy_pass http://buscas:3003/buscas;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/buscas/ {
    proxy_pass http://buscas:3003/buscas/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # REST e WebSocket de Avisos. O WebSocket recebe o access token como
  # primeira mensagem, sem expor credenciais na URL.
  location = /api/avisos {
    proxy_pass http://avisos:3005/avisos;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/avisos/ {
    proxy_pass http://avisos:3005/avisos/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/avisos {
    proxy_pass http://avisos:3005/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Arquivos do build com hash no nome podem ficar em cache por muito tempo
  location /assets/ {
    expires 1y;   # Cache-Control: max-age=31536000
  }

  # Rotas do React Router (ex.: /login) caem no index.html
  location / {
    try_files $uri /index.html;
    expires -1;   # Cache-Control: no-cache
  }
}
