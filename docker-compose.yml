# Banco da Autenticação, Publicações, RabbitMQ e aplicativo web.
#
# Antes de subir: copie .env.example para .env e preencha JWT_SECRET.
#   docker compose up --build
# App em http://localhost:8080

services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: reencontra
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?defina AUTH_DB_PASSWORD no .env}
    volumes:
      - auth-db-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reencontra -d auth_db"]
      interval: 5s
      retries: 10
    # Sem "ports": o banco só é acessível pela rede interna do Compose

  autenticacao:
    build:
      context: .
      dockerfile: services/autenticacao/Dockerfile
    environment:
      DATABASE_URL: postgresql://reencontra:${AUTH_DB_PASSWORD}@auth-db:5432/auth_db?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      CORS_ORIGINS: http://localhost:8080
      COOKIE_PATH: /api/auth
      TRUST_PROXY: 1
    depends_on:
      auth-db:
        condition: service_healthy
    # A imagem não tem curl/wget; o Node 22 já tem fetch
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 12
      start_period: 20s
    # Sem "ports": REST chega pelo Nginx do web; gRPC (50051) só para os
    # outros serviços, pela rede interna.

  publicacoes-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: publicacoes_db
      POSTGRES_USER: reencontra_publicacoes
      POSTGRES_PASSWORD: ${PUBLICACOES_DB_PASSWORD:?defina PUBLICACOES_DB_PASSWORD no .env}
    volumes:
      - publicacoes-db-dados:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reencontra_publicacoes -d publicacoes_db"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-reencontra}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env}
    volumes:
      - rabbitmq-dados:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  publicacoes:
    build:
      context: .
      dockerfile: services/publicacoes/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3002
      GRPC_PORT: 50052
      DATABASE_URL: postgresql://reencontra_publicacoes:${PUBLICACOES_DB_PASSWORD}@publicacoes-db:5432/publicacoes_db?schema=public
      AUTH_GRPC_URL: autenticacao:50051
      AUTH_PROTO_PATH: /app/proto/auth.proto
      PUBLICACOES_PROTO_PATH: /app/proto/publicacoes.proto
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-reencontra}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_EXCHANGE: achados.eventos
      PUBLICACOES_CODE_SECRET: ${PUBLICACOES_CODE_SECRET:?defina PUBLICACOES_CODE_SECRET no .env}
      PUBLICACOES_UPLOAD_DIR: /app/services/publicacoes/uploads
      CORS_ORIGINS: http://localhost:8080
      TRUST_PROXY: 1
    volumes:
      - publicacoes-arquivos:/app/services/publicacoes/uploads
    depends_on:
      publicacoes-db:
        condition: service_healthy
      autenticacao:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 12
      start_period: 20s

  buscas-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buscas_db
      POSTGRES_USER: reencontra_buscas
      POSTGRES_PASSWORD: ${BUSCAS_DB_PASSWORD:?defina BUSCAS_DB_PASSWORD no .env}
    volumes:
      - buscas-db-dados:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reencontra_buscas -d buscas_db"]
      interval: 5s
      retries: 10

  buscas:
    build:
      context: .
      dockerfile: services/buscas/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3003
      GRPC_PORT: 50053
      DATABASE_URL: postgresql://reencontra_buscas:${BUSCAS_DB_PASSWORD}@buscas-db:5432/buscas_db?schema=public
      AUTH_GRPC_URL: autenticacao:50051
      AUTH_PROTO_PATH: /app/proto/auth.proto
      BUSCAS_PROTO_PATH: /app/proto/buscas.proto
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      TRUST_PROXY: 1
    depends_on:
      buscas-db:
        condition: service_healthy
      autenticacao:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 12
      start_period: 20s

  correspondencias-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: correspondencias_db
      POSTGRES_USER: reencontra_correspondencias
      POSTGRES_PASSWORD: ${CORRESPONDENCIAS_DB_PASSWORD:?defina CORRESPONDENCIAS_DB_PASSWORD no .env}
    volumes:
      - correspondencias-db-dados:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reencontra_correspondencias -d correspondencias_db"]
      interval: 5s
      retries: 10

  correspondencias:
    build:
      context: .
      dockerfile: services/correspondencias/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://reencontra_correspondencias:${CORRESPONDENCIAS_DB_PASSWORD}@correspondencias-db:5432/correspondencias_db?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-reencontra}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_EXCHANGE: achados.eventos
      PUBLICACOES_GRPC_URL: publicacoes:50052
      PUBLICACOES_PROTO_PATH: /app/proto/publicacoes.proto
      BUSCAS_GRPC_URL: buscas:50053
      BUSCAS_PROTO_PATH: /app/proto/buscas.proto
    depends_on:
      correspondencias-db:
        condition: service_healthy
      publicacoes:
        condition: service_healthy
      buscas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 12
      start_period: 20s

  avisos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: avisos_db
      POSTGRES_USER: reencontra_avisos
      POSTGRES_PASSWORD: ${AVISOS_DB_PASSWORD:?defina AVISOS_DB_PASSWORD no .env}
    volumes:
      - avisos-db-dados:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reencontra_avisos -d avisos_db"]
      interval: 5s
      retries: 10

  avisos:
    build:
      context: .
      dockerfile: services/avisos/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://reencontra_avisos:${AVISOS_DB_PASSWORD}@avisos-db:5432/avisos_db?schema=public
      AUTH_GRPC_URL: autenticacao:50051
      AUTH_PROTO_PATH: /app/proto/auth.proto
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-reencontra}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_EXCHANGE: achados.eventos
      TRUST_PROXY: 1
    depends_on:
      avisos-db:
        condition: service_healthy
      autenticacao:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 12
      start_period: 20s

  web:
    build: ./web
    ports:
      - "8080:80"
    # O Nginx resolve "autenticacao" ao iniciar e não sobe se o nome não existir
    depends_on:
      autenticacao:
        condition: service_healthy
      publicacoes:
        condition: service_healthy
      buscas:
        condition: service_healthy
      avisos:
        condition: service_healthy

volumes:
  auth-db-dados:
  publicacoes-db-dados:
  publicacoes-arquivos:
  rabbitmq-dados:
  buscas-db-dados:
  correspondencias-db-dados:
  avisos-db-dados:
