# Por enquanto: banco da Autenticação, serviço de Autenticação e aplicativo web.
# Os outros serviços e o RabbitMQ entram aqui conforme forem ficando prontos.
#
# Antes de subir: copie .env.example para .env e preencha JWT_SECRET.
#   docker compose up --build
# App em http://localhost:8080

services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: reencontra
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?defina AUTH_DB_PASSWORD no .env}
    volumes:
      - auth-db-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reencontra -d auth_db"]
      interval: 5s
      retries: 10
    # Sem "ports": o banco só é acessível pela rede interna do Compose

  autenticacao:
    build:
      context: .
      dockerfile: services/autenticacao/Dockerfile
    environment:
      DATABASE_URL: postgresql://reencontra:${AUTH_DB_PASSWORD}@auth-db:5432/auth_db?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      CORS_ORIGINS: http://localhost:8080
      COOKIE_PATH: /api/auth
      TRUST_PROXY: 1
    depends_on:
      auth-db:
        condition: service_healthy
    # A imagem não tem curl/wget; o Node 22 já tem fetch
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 12
      start_period: 20s
    # Sem "ports": REST chega pelo Nginx do web; gRPC (50051) só para os
    # outros serviços, pela rede interna.

  web:
    build: ./web
    ports:
      - "8080:80"
    # O Nginx resolve "autenticacao" ao iniciar e não sobe se o nome não existir
    depends_on:
      autenticacao:
        condition: service_healthy

volumes:
  auth-db-dados:
